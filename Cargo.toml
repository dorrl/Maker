[package]
name = "maker"
version = "0.2.12"
edition = "2024"

[dependencies]
serde_json = { version = "1", features = ["raw_value"] }
scraper = { version = "0.27", default-features = false }
roxmltree = "0.21"
yaml-rust2 = { version = "0.13", default-features = false }

[profile.release]
lto = true
strip = true
codegen-units = 1
